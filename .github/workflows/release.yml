name: release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  # Its own job so it runs once and gates everything below it: a tag that
  # disagrees with the version in pyproject.toml would publish an image labelled
  # with a version it does not contain, and image tags are not retractable once
  # someone has pulled. A release naming a version the tree does not claim is
  # the same lie in a place people read more often.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Check the tag matches the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          project=$(uv version --short)
          if [ "$tag" != "$project" ]; then
            echo "::error::tag v$tag does not match pyproject version $project"
            exit 1
          fi

  docker:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Pushing to GHCR under this repository's own namespace, so GITHUB_TOKEN
      # is enough and there is no registry secret to keep.
      packages: write
      # Lets the build attach a signed provenance attestation to the image.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: every dependency ships a musllinux wheel for
      # both, so this costs an emulated pip install rather than a compile.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.4.2 publishes 1.4.2, 1.4 and 1, so a deployment can pin however
      # tightly it wants; `latest` moves only for a final release, which keeps a
      # v1.5.0-rc1 from becoming what an unpinned `docker run` gets.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=yazio-mcp-server
            org.opencontainers.image.description=An MCP server over the YAZIO food diary

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Last, because the release notes point people at an image that has to exist
  # by the time they read them. A failed build leaves the tag without a release,
  # which is the recoverable half: re-running the workflow finishes the job.
  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      # The only write this job needs: creating the release and its notes.
      contents: write

    steps:
      # Full history, because the generated notes are a diff against the
      # previous tag and a shallow clone has neither the tag nor the commits.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A tag with a pre-release suffix (v1.5.0-rc1) is marked as such, which
      # keeps it out of the "latest release" slot on the repository page — the
      # same line the tags above draw for the `latest` image tag.
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
